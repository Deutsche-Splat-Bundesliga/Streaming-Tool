# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build .NET CI

permissions:
    contents: read

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 9.0.x
            - name: Restore dependencies
              run: dotnet restore ./Backend/DSB.StreamBackend/DSB.StreamBackend.csproj
            - name: Build
              run: dotnet build --no-restore ./Backend/DSB.StreamBackend/DSB.StreamBackend.csproj
