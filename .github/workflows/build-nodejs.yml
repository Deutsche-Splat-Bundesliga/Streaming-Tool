# This workflow will do a clean installation of node dependencies, and run tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build Node.js CI

permissions:
    contents: read

env:
    FRONTEND_PATH: ./Frontend/control-panel

defaults:
    run:
        shell: bash

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [26.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
                  cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json
            - name: Check workflow contracts
              run: node --test tests/workflows.test.cjs
            - name: Install dependencies
              run: npm ci
              working-directory: ${{ env.FRONTEND_PATH }}
            - name: Build
              run: npm run build
              working-directory: ${{ env.FRONTEND_PATH }}
