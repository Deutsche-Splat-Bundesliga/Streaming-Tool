name: Run .NET Tests CI

permissions:
    contents: read

on:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x
            - name: Cache NuGet packages
              uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ github.workflow }}-${{ hashFiles('**/*.csproj', '**/nuget.config') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-${{ github.workflow }}-
                      ${{ runner.os }}-nuget-
            - name: Restore dependencies
              run: dotnet restore tests/DSB.StreamBackend.Tests/DSB.StreamBackend.Tests.csproj
            - name: Run Backend Unit Tests
              run: dotnet test --no-restore --verbosity normal tests/DSB.StreamBackend.Tests/DSB.StreamBackend.Tests.csproj
