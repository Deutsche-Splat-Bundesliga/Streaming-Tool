name: "Check Pull Request labels for merge block"

on:
    pull_request:
        types:
            - opened
            - labeled
            - unlabeled

permissions:
    contents: read

jobs:
    fail-by-label:
        runs-on: ubuntu-latest
        steps:
            - name: Fail in case Pull Request is labeled with "NoMerge"
              if: contains(github.event.pull_request.labels.*.name, 'NoMerge')
              run: |
                  echo "::error title=🚫 Merge blocked::The NoMerge label is applied to this pull request. Remove the NoMerge label to allow merging."

                  echo "## 🚫 Merge blocked" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "This PR cannot be merged because the **NoMerge** label is applied." >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Remove the **NoMerge** label to allow this check to pass." >> "$GITHUB_STEP_SUMMARY"

                  exit 1

            - name: Pass in case Pull Request is not labeled with "NoMerge"
              if: ${{ !contains(github.event.pull_request.labels.*.name, 'NoMerge') }}
              run: |
                  echo "## ✅ Merge permitted" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "This PR may be merged because the **NoMerge** label is not applied." >> "$GITHUB_STEP_SUMMARY"
