version: 2

updates:
  # Angular / npm dependencies
  - package-ecosystem: "npm"
    directory: "/Frontend/control-panel"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # .NET / NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/Backend/DSB.StreamBackend"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
