<h1 mat-dialog-title>Turniereinstellungen</h1>
<mat-dialog-content>
  <section class="is-league-section">
    <h2>Turnierformat</h2>
    <div class="tourney-format-buttons__container">
      <button
        class="standard-format-button toggle-button"
        [class.toggled]="!state().isLeague"
        (click)="
          stateService.update({
            isLeague: false,
          })
        "
      >
        Standard
      </button>
      <button
        class="league-format-button toggle-button"
        [class.toggled]="state().isLeague"
        (click)="
          stateService.update({
            isLeague: true,
          })
        "
      >
        Liga
      </button>
    </div>
  </section>

  <section class="start-time-section">
    <h2>Startzeit</h2>
    <input
      type="datetime-local"
      [ngModel]="state().startTime"
      (ngModelChange)="
        stateService.update({
          startTime: $event,
        })
      "
    />
  </section>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="click-button" mat-dialog-close>✖</button>
</mat-dialog-actions>
