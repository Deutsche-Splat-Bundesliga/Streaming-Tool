<main *transloco="let t">
  <h1 mat-dialog-title>{{ t('text.socials') }}</h1>
  <mat-dialog-content>
    <section>
      <h2>{{ t('text.twitter-x') }}</h2>
      <input
        class="twitter-handle-input"
        placeholder="@TwitterHandle"
        [ngModel]="socials().xHandle"
        (ngModelChange)="
          socialsService.update({
            xHandle: $event,
          })
        "
      />
    </section>

    <section>
      <h2>{{ t('text.discord-invite') }}</h2>
      <input
        class="discord-invite-input"
        placeholder="Invite"
        [ngModel]="socials().discordInvite"
        (ngModelChange)="
          socialsService.update({
            discordInvite: $event,
          })
        "
      />
    </section>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button class="click-button" mat-dialog-close>✖</button>
  </mat-dialog-actions>
</main>
