<div class="infobox dsb-panel dsb-gradient" [class.overlay-hidden]="!state().showInfobox">
  <span class="tourney-info">{{ tournamentInfo }}</span>

  <div class="versus">
    <app-resizable-text
      [resizableTextContent]="state().teamAlphaName"
      [aspectRatio]="'xMaxYMid meet'"
    />

    <strong class="versus-text">VS</strong>

    <app-resizable-text [resizableTextContent]="state().teamBravoName" />
  </div>

  <span class="score">
    {{ state().scoreAlpha }}
    :
    {{ state().scoreBravo }}
  </span>

  <img src="assets/dsb/DSB_Logo.png" width="100px" alt="DSB Logo" />
</div>

<app-commentator-box class="make-responsive"></app-commentator-box>
