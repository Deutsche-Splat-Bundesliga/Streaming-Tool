<div
  class="commentator-box dsb-panel dsb-gradient"
  [class.overlay-hidden]="!state().showCommentatorBox"
  [class.on-score-box]="onScoreBox"
>
  <div class="streamer__container">
    <img class="streamer-icon icon" src="assets/misc/Camera_Streamer.svg" alt="Streamer Icon" />
    <span class="streamer-text info-text">{{ state().streamer || 'Streamer' }}</span>
  </div>

  <div class="commentators__container">
    <img
      class="commentators-icon icon"
      src="assets/misc/Microphone_Commentators.svg"
      alt="Commentator Icon"
    />
    <span class="commentator1-text info-text">{{ state().commentator1 || 'Kommentator 1' }}</span>
    <span class="commentator2-text info-text">{{ state().commentator2 || 'Kommentator 2' }}</span>
  </div>
</div>
