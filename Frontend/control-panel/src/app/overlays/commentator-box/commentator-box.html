<div
  class="commentator-box dsb-panel"
  [class.overlay-hidden]="!state().showCommentatorBox"
  [class.on-score-box]="onScoreBox"
>
  <div class="streamer__container">
    <img class="streamer-icon icon" src="assets/misc/Camera_Streamer.svg" />
    <span class="streamer-text">{{ state().streamer }}</span>
  </div>

  <div class="commentators__container">
    <img class="commentators-icon icon" src="assets/misc/Microphone_Commentators.svg" />
    <span
      class="commentator1-text"
      [class.use-padding]="state().commentator1 && state().commentator2 && !onScoreBox"
      >{{ state().commentator1 }}
    </span>
    <span class="commentator2-text">{{ state().commentator2 }}</span>
  </div>
</div>
