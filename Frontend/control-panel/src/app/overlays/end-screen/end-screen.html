<div class="end-screen">
  <img
    class="dsb-logo"
    [src]="brandingService.branding().largeLogoUrl"
    [alt]="brandingService.branding().organizationName"
  />
  <span class="ending-text">
    GGs und danke fürs Mitfiebern! <br />
    Bis zum nächsten Match - Stay Fresh!
  </span>

  <div class="socials__container">
    @if (socials().xHandle) {
      <img
        alt="Twitter Profile"
        class="socials-icon twitter-icon"
        src="assets/socials/twitter-logo.svg"
      />
      <span class="socials-text twitter-link">{{ socials().xHandle }}</span>
    }

    @if (socials().discordInvite) {
      <img
        alt="Discord Server"
        class="socials-icon discord-icon"
        src="assets/socials/discord-logo.svg"
      />
      <span class="socials-text discord-invite">discord.gg/{{ socials().discordInvite }}</span>
    }
  </div>
</div>
