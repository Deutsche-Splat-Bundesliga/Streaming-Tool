<div class="edit-menu" *transloco="let t">
  @for (mode of availableModes(); track mode.id) {
    <img
      class="mode-image"
      [src]="'assets/modes/' + mode.id + '.png'"
      [alt]="mode.name + ' Icon'"
      (click)="changeMode(mode.id)"
    />
  }
  <img
    class="mode-image"
    src="assets/modes/delete.png"
    alt="Delete Map Icon"
    (click)="deleteMap()"
  />
  <div class="close" (click)="closeEditMenu()">✖</div>
</div>
