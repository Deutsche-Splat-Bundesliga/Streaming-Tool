<div class="notification__container" [ngClass]="notificationTypeClass" *transloco="let t">
  <span class="notification-icon"></span>
  <span class="notification-text">{{ t(text) }}</span>

  <button class="btn-dismiss-notification" (click)="dismissBtnClick($event)"></button>

  <div class="notification-timer" #ntfTimer></div>
</div>
