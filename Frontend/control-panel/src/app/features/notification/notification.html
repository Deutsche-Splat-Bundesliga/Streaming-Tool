<div class="notification__container" [ngClass]="notificationTypeClass" *transloco="let t">
  <span class="notification-icon"></span>
  <span class="notification-text">{{ t(text) }}</span>

  <button
    class="btn-dismiss-notification"
    [class.hidden]="duration <= 0"
    (click)="dismissBtnClick($event)"
  ></button>

  <div class="notification-timer" [class.hidden]="duration <= 0" #ntfTimer></div>
</div>
